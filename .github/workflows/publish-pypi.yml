# .github/workflows/publish-pypi.yml
#
# Publishes the package to PyPI when a version tag is pushed.
# Uses OIDC trusted publishing (no API tokens needed).
#
# Prerequisites:
#   1. Configure trusted publisher on PyPI
#   2. Create a "pypi" environment in GitHub repo settings

name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  # ── Job 1: Build ──────────────────────────────────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify version matches tag
        run: |
          WHEEL_VERSION=$(ls dist/*.whl | sed -E 's/.*-([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Wheel version: $WHEEL_VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$WHEEL_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Version mismatch! Wheel=$WHEEL_VERSION, Tag=$TAG_VERSION"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── Job 2: Publish to PyPI ─────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/encoding-atlas

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── Job 3: Create GitHub Release ────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

  # ── Job 4: Update Version Metadata ────────────────────────────
  # After a release is published, update CITATION.cff and README.md
  # on master so they always reflect the latest released version.
  # Uses GITHUB_TOKEN which intentionally does not trigger other
  # workflows, preventing infinite loops.
  update-metadata:
    name: Update Version Metadata
    needs: github-release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, 'rc') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Extract version and date
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          DATE="$(date -u +%Y-%m-%d)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "date=${DATE}" >> "${GITHUB_OUTPUT}"

      - name: Update CITATION.cff
        run: |
          sed -i 's/^version: ".*"/version: "${{ steps.meta.outputs.version }}"/' CITATION.cff
          sed -i 's/^date-released: ".*"/date-released: "${{ steps.meta.outputs.date }}"/' CITATION.cff

      - name: Update README.md bibtex version
        run: |
          sed -i 's/version={[^}]*}/version={${{ steps.meta.outputs.version }}}/' README.md

      - name: Commit and push if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "Ashutosh Mishra"
          git config user.email "ashutoshm1771@gmail.com"
          git add CITATION.cff README.md
          git commit -m "chore: update version metadata to ${{ steps.meta.outputs.version }}"
          git push origin master
